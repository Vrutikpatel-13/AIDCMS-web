<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link href="../../assets/css/output.css" rel="stylesheet" />
    <title>AI-DCIM - Two-Factor Authentication</title>
    
    <link href="../../assets/css/material-symbols-outlined.css" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#258cf4",
                        "background-light": "#f5f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Custom styles for confirmation code input */
        .confirmation-code-input {
            background-color: transparent;
            color:black;

            /* Use a neutral border color */
            transition: border-color 0.2s ease-in-out;
            text-align: center;
            font-size: 1.5rem;
            /* Larger font size for visibility */
            font-weight: 500;
             border: 2px solid var(--neon-blue);
            background-color:white;
        }

        .confirmation-code-input:focus {
            outline: none;
           
            /* Neon blue on focus */
        }

        /* Remove number input spinners for WebKit/Blink */
        .confirmation-code-input::-webkit-outer-spin-button,
        .confirmation-code-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Remove number input spinners for Firefox */
        .confirmation-code-input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>

<body class="bg-background-dark font-display">
    <div class="relative flex min-h-screen w-full flex-col items-center justify-center bg-background-dark p-4 group/design-root"

                    <div class="flex items-center justify-center rounded-full bg-primary/10 p-4">
                        <span class="material-symbols-outlined text-4xl text-neon-blue text-white">shield_lock</span>
                    </div>

                        <p class="text-3xl font-bold leading-tight tracking-tight text-white">Two-Factor
                            Authentication</p>

                            authenticator app.</p>
                    </div>

                <div class="flex w-full items-center justify-start px-4">
                    <div class="flex items-center gap-3">
                        <input
                            class="h-5 w-5 rounded border-2 border-[#314d68] bg-transparent text-neon-blue checked:border-neon-blue checked:bg-neon-blue focus:ring-0 focus:ring-offset-0"
                            id="remember-device" type="checkbox" />
                        <label class="cursor-pointer text-sm font-medium leading-normal text-white"
                            for="remember-device">Remember this device for 30 days</label>
                    </div>
                </div>
                <!-- Verify Button -->
                <div class="flex w-full px-4 py-3">
                    <a href="../../pages/auth/roleselection.html"

                <!-- Secondary Links -->

                    <a class="font-medium text-white transition-colors hover:text-neon-blue" href="#">Haven't

            </div>
        </div>
    </div>
