<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link href="https://cdn.tailwindcss.com" rel="stylesheet" />
    <title>Forgot Password - AI-DCIM</title>
    <link href="../../assets/css/output.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

</head>

<body class="font-display">
    <div class="relative flex h-auto min-h-screen w-full flex-col items-center justify-center bg-background-light dark:bg-background-dark dark group/design-root overflow-x-hidden"
        style='font-family: Inter, "Noto Sans", sans-serif;'>
        <div class="layout-container flex h-full grow flex-col justify-center w-full max-w-md p-6 sm:p-8">
            <div
                class="flex w-full flex-col items-center rounded-xl border border-white/10 bg-[#1E1E1E] p-8 shadow-2xl shadow-black/20">
                <!-- Logo -->
                <div class="mb-6 flex h-12 w-12 items-center justify-center rounded-lg bg-primary/20 text-primary">
                    <span class="material-symbols-outlined text-3xl" data-icon="shield_lock">shield_lock</span>
                </div>
                <!-- HeadlineText -->
                <h1 class="text-white tracking-light text-[32px] font-bold leading-tight text-center pb-2">Forgot
                    Password?</h1>
                <!-- BodyText -->
                <p class="text-[#E0E0E0] text-base font-normal leading-normal pb-6 text-center">
                    No problem. Enter your email address below and we'll send you instructions to reset your password.
                </p>
                <!-- TextField -->
                <div class="flex w-full flex-wrap items-end gap-4 py-3">
                    <label class="flex w-full flex-col flex-1">
                        <p class="text-[#E0E0E0] text-sm font-medium leading-normal pb-2">Email Address</p>
                        <div class="relative w-full">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-xl text-black">mail</span>
                            <input
                                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-white/20 bg-[#121212] focus:border-primary h-14 placeholder:text-[#90adcb] pl-12 pr-4 py-3 text-base font-normal leading-normal"
                                placeholder="you@company.com" value="" />
                        </div>
                    </label>
                </div>
                <!-- SingleButton -->
                <div class="flex w-full px-0 pt-4 pb-3 justify-center">
                    <button
                        class="flex min-w-[84px] w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-primary text-black text-base font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 transition-colors duration-200">
                        <span class="truncate">Send Reset Link</span>
                    </button>
                </div>
                <!-- "Back to Login" Link -->
                <div class="flex w-full flex-col items-center pt-6">
                    <a class="flex mt-2 items-center gap-2 text-sm font-medium text-[#E0E0E0] hover:text-primary transition-colors duration-200"
                        href="../../index.html">
                        <span class="material-symbols-outlined text-base">arrow_back</span>
                        <span>Remember your password? Back to Login</span>
                    </a>
                </div>
            </div>
            <!-- Security Note -->
            <div class="mt-6 text-center">
                <p class="text-xs text-gray-500">For security reasons, we do not confirm whether an email address is
                    registered in our system.</p>
            </div>
        </div>
    </div>
</body>

</html>
