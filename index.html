<body class="bg-background-light dark:bg-background-dark">

        <div class="absolute inset-0 z-0 h-full w-full">
            <div class="relative h-full w-full bg-cover bg-center bg-no-repeat"

                <div class="absolute inset-0 bg-background-dark/80 backdrop-blur-sm"></div>
            </div>
        </div>
        <div class="relative z-10 flex w-full max-w-md flex-col items-center p-6 sm:p-8">
            <!-- Header Logo -->
            <div class="mb-8 flex flex-col items-center">
                <span class="material-symbols-outlined text-primary mb-2"
                    style="font-size: 48px; font-variation-settings: 'FILL' 1, 'wght' 300, 'GRAD' 0, 'opsz' 48;">
                    lan

                <p class="text-2xl font-bold text-gray-200 dark:text-gray-200">AI-DCIM Platform</p>
            </div>
            <!-- Form Container -->
            <div class="w-full rounded-xl bg-[#1E1E1E]/80 p-8 shadow-2xl shadow-black/30 backdrop-blur-md">
                <div class="flex flex-col items-center">
                    <h1 class="text-2xl font-bold tracking-tight text-[#E0E0E0] md:text-3xl">Welcome Back</h1>
                    <p class="mt-2 text-center text-sm text-gray-400 dark:text-gray-400">Please enter your credentials
                        to log in.</p>
                </div>
                <form class="mt-8 space-y-6">
                    <!-- Username or Email Field -->
                    <div class="relative">
                        <label class="sr-only" for="username">Username or Email</label>
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
                            person
                        </span>
                        <input autocomplete="username"
                            class="form-input h-14 w-full rounded-lg border border-[#4A4A4A] bg-[#121212]/50 p-4 pl-12 text-base text-[#E0E0E0] placeholder:text-gray-500 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/50"
                            id="username" name="username" placeholder="Username or Email" required="" type="text"
                            value="" />
                    </div>
                    <!-- Password Field -->
                    <div class="relative">
                        <label class="sr-only" for="password">Password</label>
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
                            lock
                        </span>
                        <input autocomplete="current-password"
                            class="form-input h-14 w-full rounded-lg border border-[#4A4A4A] bg-[#121212]/50 p-4 pl-12 pr-12 text-base text-[#E0E0E0] placeholder:text-gray-500 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/50"
                            id="password" name="password" placeholder="Password" required="" type="password" value="" />
                        <button class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-primary"
                            type="button">
                            <span class="material-symbols-outlined">
                                visibility
                            </span>
                        </button>
                    </div>
                    <div class="flex items-center justify-end">
                        <a class="text-sm font-medium text-primary hover:underline" href="pages/auth/forgot-password.html">
                            Forgot Password?
                        </a>
                    </div>
                 
                    <a href="pages/auth/mfa.html"
                        class="flex h-14 w-full items-center justify-center rounded-lg bg-primary px-4 py-2 text-base font-semibold text-background-dark shadow-sm transition-transform duration-200 ease-in-out hover:scale-[1.02] active:scale-[0.98]">
                        Log In
                    </a>
            </div>
            </form>
        </div>
        <!-- Footer -->
